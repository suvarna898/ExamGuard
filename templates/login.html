<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ExamGuard | Candidate Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #4f46e5 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #7c3aed 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #111827,
                    #312e81
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            width: 100%;

            max-width: 430px;

            background:
                rgba(255,255,255,0.97);

            border-radius: 24px;

            padding: 38px 40px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.30);

            border:
                1px solid
                rgba(255,255,255,0.5);

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            color: #172554;

            font-size: 23px;

            font-weight: 800;

            margin-bottom: 25px;

        }


        .logo-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            color: white;

            font-size: 20px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 7px 18px
                rgba(99,102,241,0.35);

        }


        .purple-text {

            color: #6366f1;

        }


        /* =========================================
           HEADING
        ========================================= */

        .heading {

            text-align: center;

            margin-bottom: 28px;

        }


        .heading h1 {

            color: #172033;

            font-size: 27px;

            margin-bottom: 7px;

        }


        .heading p {

            color: #64748b;

            font-size: 13px;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 19px;

        }


        .form-group label {

            display: block;

            color: #334155;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        .form-group input {

            width: 100%;

            height: 46px;

            padding: 0 14px;

            border:
                1px solid
                #d8def0;

            border-radius: 10px;

            background: #f8fafc;

            color: #172033;

            font-size: 13px;

            outline: none;

            transition: 0.2s;

        }


        .form-group input:focus {

            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(99,102,241,0.12);

        }


        .form-group input::placeholder {

            color: #94a3b8;

        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 46px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 17px
                rgba(99,102,241,0.32);

            transition: 0.2s;

        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 22px
                rgba(99,102,241,0.45);

        }


        /* =========================================
           REGISTER SECTION
        ========================================= */

        .register-section {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 5px;

            padding-top: 21px;

            margin-top: 21px;

            border-top:
                1px solid
                #e2e8f0;

            font-size: 12px;

        }


        .register-section p {

            color: #64748b;

        }


        .register-section a {

            color: #6366f1;

            font-weight: 700;

            text-decoration: none;

        }


        .register-section a:hover {

            text-decoration: underline;

        }


        /* =========================================
           SECURITY MESSAGE
        ========================================= */

        .security-message {

            margin-top: 17px;

            padding: 11px;

            text-align: center;

            border-radius: 10px;

            background: #eef2ff;

            color: #4f46e5;

            font-size: 11px;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;

            }


            .login-card {

                padding: 30px 22px;

                border-radius: 20px;

            }


            .heading h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- =========================================
         LOGO
    ========================================= -->

    <div class="logo">

        <div class="logo-icon">

            🛡

        </div>


        <span>

            Exam<span class="purple-text">
                Guard
            </span>

        </span>

    </div>



    <!-- =========================================
         HEADING
    ========================================= -->

    <div class="heading">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue to your examination
        </p>

    </div>



    <!-- =========================================
         LOGIN FORM
    ========================================= -->

    <form
        action="/login"
        method="POST">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>



        <!-- LOGIN -->

        <button
            type="submit"
            class="login-button">

            Login →

        </button>


    </form>



    <!-- =========================================
         REGISTER LINK
    ========================================= -->

    <div class="register-section">

        <p>
            Don't have an account?
        </p>


        <a href="/register">

            Create an account

        </a>

    </div>



    <!-- =========================================
         SECURITY
    ========================================= -->

    <div class="security-message">

        🔒 Your login information is secure

    </div>


</div>


</body>

</html>
